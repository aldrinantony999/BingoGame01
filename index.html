<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f4f1ea; --surface:#ffffff; --text:#1f2430; --muted:#6b7280;
  --accent:#d9480f; --accent-text:#ffffff; --cell:#fff7ed; --cell-border:#fdba74;
  --mark:#2f9e44; --mark-text:#ffffff; --win:#f59f00; --off:#d1d5db; --o:#1971c2;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#16181d; --surface:#222630; --text:#eceef3; --muted:#9aa1b0;
    --accent:#f76707; --cell:#2c2f3a; --cell-border:#5c4326; --mark:#37b24d; --off:#454a58; --o:#4dabf7;
  }
}
html{height:100%;height:100dvh;overflow:hidden}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:480px;height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:6px;padding:6px 10px;
  overflow-x:hidden;overflow-y:auto}
.hidden{display:none !important}
.game{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}

/* top switcher */
.games{display:flex;gap:6px;flex:none}
.gamebtn{flex:1;min-width:0;padding:8px 4px;border:2px solid var(--cell-border);background:var(--surface);color:var(--text);
  border-radius:12px;font-weight:800;font-size:.9rem;white-space:nowrap;cursor:pointer;font-family:inherit}
.gamebtn.active{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.iconbtn{flex:0 0 auto;width:44px;padding:0;border:2px solid var(--cell-border);background:var(--surface);
  border-radius:12px;font-size:1.2rem;cursor:pointer}
.frames{flex:1;min-height:0;position:relative}
.frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}
</style>
</head>
<body>
<main>
  <div class="games" id="games"></div>
  <div class="frames" id="frames"></div>
</main>
<script>
/* Each game is its own HTML file. To add a game: create its file and add one line here. */
const GAMES=[
  {id:'bingo', label:'🎱 Bingo',  src:'bingo.html'},
  {id:'xox',   label:'❌⭕ XOX',   src:'xox.html'},
  {id:'hunt',  label:'🔢 Hunt',   src:'numberhunt.html'}
];
let soundOn=true, current=null;
const bar=document.getElementById('games'), frames=document.getElementById('frames');
const btns={}, iframes={};
GAMES.forEach(g=>{
  const b=document.createElement('button');
  b.className='gamebtn'; b.textContent=g.label; b.onclick=()=>show(g.id);
  bar.appendChild(b); btns[g.id]=b;
});
const sb=document.createElement('button');
sb.className='iconbtn'; sb.textContent='🔊'; sb.title='Sound on/off'; sb.setAttribute('aria-label','Sound on/off');
sb.onclick=()=>{ soundOn=!soundOn; sb.textContent=soundOn?'🔊':'🔇'; Object.keys(iframes).forEach(id=>post(id,{t:'sound',on:soundOn})); };
bar.appendChild(sb);
function post(id,m){ try{ iframes[id].contentWindow.postMessage(Object.assign({app:'games'},m),'*'); }catch(e){} }
function show(id){
  const g=GAMES.find(x=>x.id===id); if(!g) return;
  if(!iframes[id]){
    const f=document.createElement('iframe');
    f.src=g.src; f.title=g.label.replace(/^[^A-Za-z]+/,''); f.setAttribute('allow','autoplay');
    f.addEventListener('load',()=>post(id,{t:'sound',on:soundOn}));
    frames.appendChild(f); iframes[id]=f;
  }
  GAMES.forEach(x=>{
    const on=x.id===id;
    btns[x.id].classList.toggle('active',on);
    if(iframes[x.id]){ iframes[x.id].style.display=on?'block':'none'; if(on!==(current===x.id)||!current) post(x.id,{t:'visible',on}); }
  });
  current=id; document.title=g.label.replace(/^[^A-Za-z]+/,'');
  try{ history.replaceState(null,'','#'+id); }catch(e){}
}
window.addEventListener('message',e=>{
  const m=e.data; if(!m||m.app!=='games'||m.t!=='ready') return;
  Object.keys(iframes).forEach(id=>{ if(iframes[id].contentWindow===e.source) post(id,{t:'sound',on:soundOn}); });
});
window.addEventListener('hashchange',()=>{ const id=location.hash.slice(1); if(GAMES.some(g=>g.id===id)&&id!==current) show(id); });
show(GAMES.some(g=>g.id===location.hash.slice(1))?location.hash.slice(1):GAMES[0].id);
</script>
</body>
</html>
